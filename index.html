<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="css/site.css">
<style>
  .hero-image{
    display:block;
    width:auto;
    max-width:100%;
    height:auto;
    max-height:80vh;
    margin:0 auto;
    border-radius:2px;
  }
  .cta-row{ display:flex; justify-content:flex-end; margin-top:22px; }
  .site-footer{ margin-top:96px; }
  @media (max-width:480px){
    .cta-row{ justify-content:stretch; }
    .cta-row .btn{ width:100%; text-align:center; }
    .site-footer{ margin-top:64px; }
  }
</style>
</head>
<body>
<div data-include="partials/header.html"></div>
<main>

  <!-- To change the featured painting: replace images/hero.jpg and update the alt text below -->
  <img class="hero-image" src="images/hero.jpg" alt="Featured painting: a pale reclining figure in a dark, warm-toned studio" width="1600" height="1568">

  <div class="cta-row">
    <a class="btn btn-primary" href="works.html">Explore available work</a>
  </div>

</main>
<footer class="site-footer" data-include="partials/footer.html"></footer>
<script src="js/include.js"></script>
<script src="js/site.js"></script>
</body>
</html>
