<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiet Harbor — Print</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div data-include="partials/header.html"></div>
<main>

  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="shop.html">Shop</a> / <a href="shop-prints.html">Prints</a></nav>

  <!-- Example item page for the Prints template. No print sizes/options were given in the deck — see Open Items. -->
  <div class="item-grid">
    <div class="item-main-image art-2" role="img" aria-label="Placeholder — main print photo"></div>
    <div class="item-info">
      <h1>Quiet Harbor (print)</h1>
      <p class="item-price">$ 45</p>
      <div class="item-meta">
        <p>Giclée print</p>
        <p>11 × 14 in</p>
      </div>
      <p id="print-details" class="item-details">
        Placeholder additional information — paper stock, print sizes/options once decided,
        shipping details.
      </p>
      <button class="read-more-toggle" data-target="#print-details">Read more</button>

      <div class="qty-stepper">
        <button type="button" data-step="-1" aria-label="Decrease quantity">−</button>
        <input type="text" value="1" inputmode="numeric" aria-label="Quantity">
        <button type="button" data-step="1" aria-label="Increase quantity">+</button>
      </div>
      <div>
        <!-- Stub only — same unresolved checkout-provider decision as the Originals item page. -->
        <button class="btn btn-primary" disabled title="Checkout provider not yet connected — see Open Items">Add to cart</button>
      </div>
      <div class="thumb-row">
        <div class="thumb-sm art-2"></div>
        <div class="thumb-sm art-5"></div>
        <div class="thumb-sm art-6"></div>
      </div>
    </div>
  </div>

</main>
<footer class="site-footer" style="margin-top:96px" data-include="partials/footer.html"></footer>
<script src="js/include.js"></script>
<script src="js/site.js"></script>
</body>
</html>
