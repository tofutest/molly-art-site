<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook Spreads</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div data-include="partials/header.html"></div>
<main>

  <div class="page-header">
    <h1>Sketchbook spreads</h1>
  </div>

  <div class="masonry-grid">
    <a class="lightbox-trigger masonry-item short art-5" href="#" data-title="Sketchbook, p. 12–13" data-info="Graphite and ink, travel sketchbook" data-bg="linear-gradient(140deg, #ece0b8 0%, #c7a95c 45%, #6e5420 100%)"></a>
    <a class="lightbox-trigger masonry-item art-2" href="#" data-title="Sketchbook, p. 21" data-info="Watercolor pencil" data-bg="linear-gradient(160deg, #cdd8c6 0%, #8fa98f 45%, #46624f 100%)"></a>
    <a class="lightbox-trigger masonry-item tall art-6" href="#" data-title="Sketchbook, p. 4–5" data-info="Ink wash, travel sketchbook" data-bg="linear-gradient(155deg, #e3cfe0 0%, #a97fa3 45%, #52315a 100%)"></a>
    <a class="lightbox-trigger masonry-item art-1" href="#" data-title="Sketchbook, p. 30" data-info="Graphite" data-bg="linear-gradient(135deg, #e8d9c3 0%, #c9a789 25%, #a07a7f 50%, #5c6a86 75%, #2b3147 100%)"></a>
    <a class="lightbox-trigger masonry-item short art-4" href="#" data-title="Sketchbook, p. 18" data-info="Watercolor pencil" data-bg="linear-gradient(150deg, #d8dbe8 0%, #8f97b8 50%, #3c3f5c 100%)"></a>
    <a class="lightbox-trigger masonry-item art-3" href="#" data-title="Sketchbook, p. 8–9" data-info="Ink wash, travel sketchbook" data-bg="linear-gradient(145deg, #e9c9c0 0%, #c98a7a 40%, #6b3d3a 100%)"></a>
  </div>

</main>
<footer class="site-footer" style="margin-top:96px" data-include="partials/footer.html"></footer>

<div id="lightbox" class="lightbox-overlay">
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-prev" aria-label="Previous artwork">&#8249;</button>
  <div class="lightbox-body">
    <div class="lightbox-image"></div>
    <div class="lightbox-text">
      <h3 class="lightbox-title"></h3>
      <p class="lightbox-info"></p>
    </div>
  </div>
  <button class="lightbox-next" aria-label="Next artwork">&#8250;</button>
</div>

<script src="js/include.js"></script>
<script src="js/site.js"></script>
</body>
</html>
