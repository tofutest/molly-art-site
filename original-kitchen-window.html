<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- EDIT: artwork title (shows in the browser tab) -->
<title>Kitchen Window</title>
<link rel="stylesheet" href="css/site.css">
<!-- PayPal cart — keep this line as is on every artwork page -->
<script src="https://www.paypalobjects.com/ncp/sb/cart/cart.js" data-merchant-id="NS4HV3FWX4GFE"></script>
</head>
<body>
<div data-include="partials/header.html"></div>
<main>

  <!--
    One page per original artwork. To add a new one, copy this file, rename it
    original-<artwork-name>.html, and change every spot marked EDIT.
    Step-by-step guide: docs/adding-an-original.html
  -->
  <div class="item-grid">

    <!-- EDIT: main photo. When there's a real photo, replace the line below with:
         <img class="item-main-image" src="images/YOUR-PHOTO.jpg" alt="Short description of the artwork"> -->
    <div class="item-main-image art-3" role="img" aria-label="Placeholder — main artwork photo"></div>

    <div class="item-info">
      <!-- EDIT: title -->
      <h1>Kitchen Window</h1>
      <!-- EDIT: price -->
      <p class="item-price">$ 410</p>
      <div class="item-meta">
        <!-- EDIT: medium and size -->
        <p>Oil on board</p>
        <p>16 × 20 in</p>
      </div>
      <!-- EDIT: details for buyers (framing, condition, shipping...) -->
      <p id="item-details" class="item-details">
        Placeholder additional information — framing notes, condition, shipping details, or
        anything else the artist wants buyers to know before purchasing.
      </p>
      <button class="read-more-toggle" data-target="#item-details">Read more</button>
      <div>
        <!-- EDIT: PayPal "Add to Cart" — paste the code PayPal gives you for THIS artwork
             between the START and END lines, replacing what's there. -->
        <!-- PayPal Add to Cart START -->
        <button class="btn btn-primary" style="margin-bottom:16px" disabled title="Not for sale online yet — PayPal button still to be added">Add to cart</button>
        <!-- PayPal Add to Cart END -->

        <!-- PayPal "View Cart" button — same on every page, no need to change -->
        <paypal-cart-button data-id="pp-view-cart"></paypal-cart-button>
        <script>
          cartPaypal.Cart({ id: "pp-view-cart" })
        </script>
      </div>
      <!-- EDIT: extra photos (optional) -->
      <div class="thumb-row">
        <div class="thumb-sm art-1"></div>
        <div class="thumb-sm art-2"></div>
        <div class="thumb-sm art-3"></div>
        <div class="thumb-sm art-4"></div>
      </div>
    </div>
  </div>

</main>
<footer class="site-footer" style="margin-top:96px" data-include="partials/footer.html"></footer>
<script src="js/include.js"></script>
<script src="js/site.js"></script>
</body>
</html>
